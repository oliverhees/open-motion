# Open Motion for Coolify (or any Docker host): two services, one shared data volume.
#   app     editor + API (gets the domain)
#   worker  renders exports and transcribes (no domain needed)
# Required:  OPENMOTION_PASSWORD
# Optional:  OPENMOTION_WORKER_VARIANT=whisper   (local Whisper in the worker, bigger image)
name: openmotion

services:
  app:
    build:
      context: .
      target: slim
    environment:
      OPENMOTION_ROLE: app
      OPENMOTION_PASSWORD: ${OPENMOTION_PASSWORD:?Please set OPENMOTION_PASSWORD}
      OPENMOTION_COOKIE_SECURE: ${OPENMOTION_COOKIE_SECURE:-1}
      OPENMOTION_DEBUG: ${OPENMOTION_DEBUG:-0}
    volumes:
      - openmotion-data:/data
    expose:
      - "4317"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4317/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  worker:
    build:
      context: .
      target: ${OPENMOTION_WORKER_VARIANT:-slim}
    environment:
      OPENMOTION_ROLE: worker
      OPENMOTION_DEBUG: ${OPENMOTION_DEBUG:-0}
      # Optional manual overrides (normally detected automatically):
      # OPENMOTION_RENDER_WORKERS: "4"
      # OPENMOTION_RENDER_GPU: "0"
    volumes:
      - openmotion-data:/data
    # Chrome needs more shared memory than Docker's 64 MB default.
    shm_size: "1gb"
    healthcheck:
      test: ["CMD", "node", "scripts/worker-health.mjs"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped

volumes:
  openmotion-data:
